name: foundation
version: "0.0.7"
description: Native pre-tool checks and post-tool observers
author: Keisei-Akiya
kind: standalone
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_verify
  - post_api_request
  - on_session_start
  - on_session_finalize
external_dependencies:
  - name: foundation
    check: "foundation --help"
    install: "see install.sh in the foundation repository"
