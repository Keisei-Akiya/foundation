name: foundation
version: "0.0.34"
description: Native tool checks, observers, and session lifecycle hooks
author: Keisei-Akiya
kind: standalone
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_finalize
  - on_session_end
  - post_llm_call
  - post_compaction
  - pre_llm_call
  - post_api_request
  - pre_verify
external_dependencies:
  - name: foundation
    check: "foundation --help"
    install: "see install.sh in the foundation repository"
