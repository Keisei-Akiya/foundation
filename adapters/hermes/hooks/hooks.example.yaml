# Paste one selected entry under `hooks:` in ~/.hermes/config.yaml.
# Replace FOUNDATION_ROOT with the absolute checkout path. Hermes parses command as argv;
# keep the executable path quoted as one argument, then put the Rust subcommand next.
# Build first: cargo build --release

# The native plugin registers preflight, hookify, and config-protection for pre_tool_call.
# Do not also enable shell-hook entries for those subcommands.

# Read-only post-edit observer combines console-log and related source signals.
# It writes warnings to stderr (not guaranteed user-visible), never blocks.
# hooks:
#   post_tool_call:
#     - command: "/FOUNDATION_ROOT/target/release/foundation" post-observer
#       matcher: "^(write_file|edit_file|patch|apply_patch|Edit|Write|MultiEdit)$"
#       timeout: 10
#       fail_closed: false

# Privacy-minimal lifecycle logging is disabled unless ECC_HERMES_SKILL_TRACK=1
# is explicitly set in the hook process environment. Requires HERMES_HOME.
# hooks:
#   post_tool_call:
#     - command: "/FOUNDATION_ROOT/target/release/foundation" lifecycle
#       matcher: "^skill$"
#       timeout: 10
#       fail_closed: false

# stop_lifecycle was not connected in the shipped sample and is removed, not ported.
