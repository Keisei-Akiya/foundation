# Paste only one selected entry under `hooks:` in ~/.hermes/config.yaml.
# Replace FOUNDATION_ROOT with the absolute checkout path; retain quoted script paths.
# Hermes parses command as argv (shell=False), so shell expansions and pipes do not work.
# Each entry requires separate user consent for its exact event/command pair.

# Narrow preflight blocker: literal `git commit --no-verify` and documented PowerShell cases.
# hooks:
#   pre_tool_call:
#     - command: python3 "/FOUNDATION_ROOT/adapters/hermes/hooks/preflight_policies.py"
#       matcher: "^(terminal|bash|Bash|powershell|PowerShell|powershell_tool|pwsh)$"
#       timeout: 5
#       fail_closed: false

# Hookify rule evaluator; inspect its configured rules before enabling.
# Supports both shell and file rules; matcher must include both tool families.
# hooks:
