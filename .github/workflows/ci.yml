name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version bump
        if: github.event_name == 'pull_request'
        run: scripts/check-version-bump.sh "origin/${{ github.base_ref }}"
      - name: Test
        run: cargo test --locked
      - name: Check Hermes post-tool integration
        run: |
          git clone https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout 3b421578588243f920886e6fe79a6faa87ea026e
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --project "$RUNNER_TEMP/hermes-agent" --locked
          cargo build --locked --bin foundation
          FOUNDATION_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/foundation" \
          HERMES_AGENT_ROOT="$RUNNER_TEMP/hermes-agent" \
            uv run --project "$RUNNER_TEMP/hermes-agent" --with pytest \
              python -m pytest -q tests/test_runtime_post_tool.py
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Shell syntax
        run: |
          sh -n install.sh
          bash -n scripts/package-release.sh
          bash -n scripts/check-version-bump.sh
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build musl target
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --target x86_64-unknown-linux-musl --bin foundation
