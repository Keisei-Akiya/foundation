name: release

# main へのpushで動く。Cargo.toml の version に対応するタグが無いときだけリリースする。
# タグは Release 作成時に自動で付く。

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide whether to release
        id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ -n "$version" ] || { echo "cannot read version from Cargo.toml" >&2; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists; skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.check.outputs.release == 'true'
        run: cargo test --locked
      - name: Install musl compiler
        if: steps.check.outputs.release == 'true'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build
        if: steps.check.outputs.release == 'true'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET" --bin foundation
      - name: Package
        if: steps.check.outputs.release == 'true'
        run: scripts/package-release.sh "$TARGET" dist
      - name: Smoke test installer against the built asset
        if: steps.check.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/hermes" <<'EOF'
          #!/bin/sh
          set -eu
          printf '%s\n' "$*" >> "$HERMES_TEST_LOG"
          case "$1:$2" in
            config:get)
              [ "$#" -eq 4 ] && [ "$3" = skills.external_dirs ] && [ "$4" = --json ]
              if [ -f "$HERMES_TEST_EXTERNAL_DIRS_FILE" ]; then cat "$HERMES_TEST_EXTERNAL_DIRS_FILE"; else printf '[]\n'; fi
              ;;
            config:set)
              [ "$#" -eq 4 ] && [ "$3" = skills.external_dirs ]
              printf '%s\n' "$4" > "$HERMES_TEST_EXTERNAL_DIRS_FILE"
              ;;
            plugins:enable)
              [ "$#" -eq 3 ] && [ "$3" = foundation ]
              printf 'plugins:\n  enabled:\n    - foundation\n' > "$HERMES_HOME/config.yaml"
              ;;
            *) exit 2 ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/bin/hermes"
          HERMES_TEST_LOG="$RUNNER_TEMP/hermes-args" HERMES_TEST_EXTERNAL_DIRS_FILE="$RUNNER_TEMP/external-dirs.json" PATH="$RUNNER_TEMP/bin:$PATH" FOUNDATION_BASE_URL="file://$PWD/dist" sh install.sh --hermes-home "$RUNNER_TEMP/hermes"
          test -x "$RUNNER_TEMP/hermes/bin/foundation"
          test -f "$RUNNER_TEMP/hermes/foundation/adapters/hermes/plugin/plugin.yaml"
          test -L "$RUNNER_TEMP/hermes/plugins/foundation"
          test -f "$RUNNER_TEMP/hermes/plugins/foundation/plugin.yaml"
          test -f "$RUNNER_TEMP/hermes/config.yaml"
          grep -Fx 'config get skills.external_dirs --json' "$RUNNER_TEMP/hermes-args"
          printf -v expected_config_set 'config set skills.external_dirs ["%s"]' "$RUNNER_TEMP/hermes/foundation/skills"
          grep -Fx "$expected_config_set" "$RUNNER_TEMP/hermes-args"
          grep -Fx 'plugins enable foundation' "$RUNNER_TEMP/hermes-args"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1])) == [sys.argv[2]]' "$RUNNER_TEMP/external-dirs.json" "$RUNNER_TEMP/hermes/foundation/skills"
          test ! -e "$RUNNER_TEMP/hermes/shell-hooks-allowlist.json"
      - name: Publish (creates the tag)
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
