[project]
name = "foundation-dev"
version = "0.1.0"
description = "Development and test dependencies for foundation"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruamel.yaml>=0.18",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"adapters/hermes/hooks/hookify_runtime.py" = ["F841"]

[tool.uv]
package = false
